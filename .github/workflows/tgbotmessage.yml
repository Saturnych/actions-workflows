name: Send TG bot message

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      status:
        required: true
        type: string

jobs:
  send:
    runs-on: ubuntu-latest

    # https://github.com/marketplace/actions/fetch-api-data
    steps:
      - name: Send bot message to group
        uses: JamesIves/fetch-api-data-action@v2
        with:
          endpoint: 'https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage'
          configuration: '{ "method": "POST", "body": {"chat_id": "${{ secrets.TELEGRAM_BOT_GROUP }}", "text": "${{ inputs.name }} - the result status: ${{ inputs.status }}"} }'

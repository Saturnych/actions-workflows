name: Send TG bot message

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      status:
        required: true
        type: string
      chat_id:
        required: true
        type: string
        
jobs:
  send:
    runs-on: ubuntu-latest

    # https://github.com/marketplace/actions/fetch-api-data
    steps:
      - name: Send telegram bot message
        uses: JamesIves/fetch-api-data-action@v2
        endpoint: 'https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage'
        configuration: '{ "method": "POST", "body": {"chat_id": "${{ inputs.chat_id }}", "text": "${{ inputs.name }} - the result status: ${{ inputs.status }}"} }'
